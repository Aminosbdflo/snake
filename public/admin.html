<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE Admin — Dashboard</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">Luxe</div>
    <div class="sidebar-sub">Admin Panel</div>

    <div class="sidebar-label">Navigation</div>
    <nav>
      <a href="/admin.html" class="active">Dashboard</a>
      <a href="/">Storefront</a>
    </nav>

    <div class="sidebar-footer">
      <a href="#" id="logout-btn">Sign Out</a>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Top Bar -->
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="topbar-right">
        <span class="topbar-user" id="admin-name">—</span>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Stats -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Products</div>
          <div class="stat-value" id="stat-products">0</div>
          <div class="stat-unit">Items</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Stock</div>
          <div class="stat-value" id="stat-stock">0</div>
          <div class="stat-unit">Units</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Catalogue Value</div>
          <div class="stat-value" id="stat-value">0</div>
          <div class="stat-unit">USD</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-wrap">
          <input type="text" id="admin-search" placeholder="Search products…" autocomplete="off">
        </div>
        <button class="btn btn-gold" id="add-btn">+ Add Product</button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-products"></tbody>
        </table>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->

  <!-- ── Modal ── -->
  <div class="modal-overlay" id="modal" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Add Product</h3>
        <button class="modal-close" id="close-modal" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="product-form" enctype="multipart/form-data">
          <input type="hidden" id="prod-id">

          <div class="field">
            <label>Product Name</label>
            <input type="text" id="prod-name" required>
          </div>
          <div class="field">
            <label>Description</label>
            <textarea id="prod-desc"></textarea>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="field">
              <label>Price (USD)</label>
              <input type="number" step="0.01" min="0" id="prod-price" required>
            </div>
            <div class="field">
              <label>Stock</label>
              <input type="number" min="0" id="prod-stock" required>
            </div>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="prod-cat">
              <option value="">Select category…</option>
              <option value="Electronics">Electronics</option>
              <option value="Accessories">Accessories</option>
              <option value="Furniture">Furniture</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Image Upload -->
          <div class="field">
            <label>Product Image</label>
            <div class="upload-area" id="upload-area">
              <input type="file" id="prod-image-file" accept="image/jpeg,image/png,image/gif,image/webp">
              <div class="upload-label">
                <span>Choose image</span> or drag & drop<br>
                <small style="color:var(--text-muted); font-size:0.55rem;">JPEG, PNG, WebP — max 5 MB</small>
              </div>
              <img id="image-preview" src="" alt="Preview">
            </div>
            <input type="text" id="prod-img" placeholder="…or enter image URL" style="margin-top:0.5rem;">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-edit" id="cancel-btn" type="button">Cancel</button>
        <button class="btn btn-gold" id="save-btn" type="button">Save Product</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
