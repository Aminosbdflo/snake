<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE — Account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="form-page">

  <!-- ── Navigation ── -->
  <nav>
    <div class="logo">Luxe</div>
    <div><a href="/">Collection</a></div>
  </nav>

  <!-- ── Forms ── -->
  <div class="form-container">

    <!-- Login -->
    <div class="form-box">
      <p class="form-eyebrow">Member Access</p>
      <h2>Sign In</h2>
      <div class="form-rule"></div>

      <form id="login-form">
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign In</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>

    <!-- Register -->
    <div class="form-box">
      <p class="form-eyebrow">New Member</p>
      <h2>Create Account</h2>
      <div class="form-rule"></div>

      <form id="register-form">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="reg-name" autocomplete="name" required>
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="reg-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="reg-password" autocomplete="new-password" required>
        </div>
        <button type="submit" style="background:transparent; color:var(--gold); border:1px solid var(--gold);">
          Create Account
        </button>
        <div id="reg-error" class="error"></div>
        <div id="reg-success" class="success"></div>
      </form>
    </div>

  </div>

  <!-- ── Footer ── -->
  <footer style="margin-top:auto;">
    <div class="footer-logo">Luxe</div>
    <p>&copy; 2026 Luxe. All rights reserved.</p>
  </footer>

  <script src="/js/login.js"></script>
</body>
</html>
